<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>Not a Human</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>


<div id="app">


    <!-- ==========================
         СТАРТ
    =========================== -->

    <section id="start-screen">


        <h1>
            Not a Human
        </h1>


        <p class="subtitle">
            Докажи, что ты человек
        </p>



        <div class="card">


            <h3>
                Создать игру
            </h3>


            <button 
                class="btn"
                id="create-room-btn">

                🕵️ Создать комнату

            </button>



            <div 
                class="room-code"
                id="created-room">

            </div>


        </div>




        <div class="card">


            <h3>
                Войти в игру
            </h3>


            <input 
                id="room-input"
                placeholder="Введите код комнаты"
                maxlength="6"
            >


            <button 
                class="btn secondary"
                id="join-room-btn">

                🔗 Подключиться

            </button>


        </div>




        <div 
            class="status"
            id="room-status">

        </div>



    </section>





    <!-- ==========================
         ЛОББИ
    =========================== -->


    <section 
        id="lobby-screen"
        class="hidden">


        <h2>
            Комната
        </h2>


        <div 
            class="room-display"
            id="room-display">

        </div>



        <div 
            class="waiting">

            ⏳ Ожидание второго игрока...

        </div>


    </section>





    <!-- ==========================
         ИГРА
    =========================== -->


    <section 
        id="game-screen"
        class="hidden">


        <header>


            <div>
                Раунд:
                <span id="round-number">
                    1
                </span>
            </div>


            <div>
                Очки:
                <span id="score">
                    0
                </span>
            </div>


        </header>




        <div class="question-card">


            <h2>
                Вопрос
            </h2>


            <p id="question-text">

                ...

            </p>


        </div>





        <div class="answer-block">


            <textarea
                id="answer-input"
                placeholder="Напишите ответ..."
            ></textarea>



            <button
                class="btn"
                id="send-answer-btn">

                Отправить

            </button>


        </div>




        <div 
            class="waiting hidden"
            id="answer-wait">

            Ответ отправлен. Ждём второго игрока...

        </div>



    </section>







    <!-- ==========================
         ГОЛОСОВАНИЕ
    =========================== -->


    <section 
        id="vote-screen"
        class="hidden">


        <h2>
            Кто настоящий человек?
        </h2>



        <div class="answers">


            <button
                class="answer-card"
                id="vote-one">

                Игрок 1

            </button>



            <button
                class="answer-card"
                id="vote-two">

                Игрок 2

            </button>


        </div>



    </section>







    <!-- ==========================
         ФИНАЛ
    =========================== -->


    <section
        id="final-screen"
        class="hidden">


        <h1>
            Игра окончена
        </h1>


        <div 
            id="final-result">

        </div>


        <button
            class="btn"
            onclick="location.reload()">

            Новая игра

        </button>


    </section>




</div>





<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>



<!-- Наши файлы -->


<script src="firebase.js"></script>

<script src="api.js"></script>

<script src="room.js"></script>

<script src="game.js"></script>

<script src="ui.js"></script>


</body>

</html>
