<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Кто здесь ИИ?</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div id="app">



<!-- СТАРТ -->

<div id="start-screen">


<h1>
🤖 Кто здесь ИИ?
</h1>


<p class="sub">
Попробуй убедить другого игрока,
что ты искусственный интеллект
</p>



<div class="card">


<input 
id="player-name"
placeholder="Ваше имя"
maxlength="20">


<button 
class="btn"
id="create-room-btn">

Создать комнату

</button>



<div class="divider">
или
</div>



<input 
id="room-code"
placeholder="Код комнаты">


<button 
class="btn btn-secondary"
id="join-room-btn">

Войти в комнату

</button>


</div>


</div>





<!-- КОМНАТА -->


<div id="room-screen" class="hidden">


<div class="card">


<h2>
Комната
</h2>


<div class="room-code"
id="room-code-display">

000000

</div>



<p id="players-status">

Ожидание игрока...

</p>



<button
class="btn"
id="start-game-btn">

Начать игру

</button>



</div>


</div>







<!-- ИГРА -->


<div id="game-screen" class="hidden">


<div class="header">


<span id="room-small">

Комната

</span>


<span id="score">

0 : 0

</span>


</div>




<div class="question-box">


<div class="label">

ВОПРОС

</div>


<div id="question-text">

Ожидание...

</div>


</div>





<div class="answer-box">


<textarea
id="answer-input"
placeholder="Напишите свой ответ...">
</textarea>



<button
class="btn"
id="send-answer-btn">

Отправить ответ

</button>



</div>




<p id="waiting-text">

</p>



</div>







<!-- ГОЛОСОВАНИЕ -->


<div id="vote-screen" class="hidden">


<h2>
Кто был ИИ?
</h2>



<div
id="answers-container">

</div>



</div>






</div>





<!-- FIREBASE -->


<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>



<script src="firebase.js"></script>

<script src="api.js"></script>

<script src="game.js"></script>



</body>

</html>
